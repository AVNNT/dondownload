# DonDownload Windows installer baseline.
#
# Build with:
#   npm run build:installer
#
# The build is intentionally local and offline after dependencies and the
# electron-builder toolchain are present. There is no publish provider, update
# feed, telemetry or cloud service configured here.

appId: com.dondownload.app
productName: DonDownload
copyright: Copyright 2026 DonDownload contributors

directories:
  output: dist

files:
  - out/**/*
  - package.json
  - LICENSE
  # The preload bundle uses only Electron and Node built-ins, and the renderer
  # bundles React. Runtime dependencies used by main (htmlparser2) are bundled
  # into out/main via electron.vite.config.ts `externalizeDepsPlugin({ exclude })`,
  # so node_modules still must not be shipped.
  - "!node_modules/**/*"
  - "!**/*.map"

extraResources:
  # Staged, version-checked third-party executables plus manifest.json.
  # build/vendor is produced by scripts/stage-vendor.ps1 and is git-ignored.
  # The whole tree is copied, so yt-dlp's official one-folder layout
  # (`yt-dlp/yt-dlp.exe` plus `yt-dlp/_internal/`) stays intact outside asar.
  - from: build/vendor
    to: vendor
  # Compiled native messaging host. Produced by scripts/build-native-host.ps1.
  - from: native/dondownload-native-host.exe
    to: native/dondownload-native-host.exe
  # Tiny native tray stub Electron hands the tray icon to before it quits an
  # idle app. Produced by scripts/build-tray-stub.ps1.
  - from: native/dondownload-tray.exe
    to: native/dondownload-tray.exe
  # Unpacked Manifest V3 extension assets for manual loading.
  - from: extension
    to: extension
  # Current-user registration helper. It is never run automatically.
  - from: scripts/register-native-host.ps1
    to: registration/register-native-host.ps1
  # Readable third-party notices, license texts and this packaging document.
  - from: third-party/NOTICE.md
    to: licenses/THIRD_PARTY_NOTICES.md
  - from: third-party/licenses
    to: licenses/third-party
  - from: docs/installer-packaging.md
    to: licenses/installer-packaging.md
  - from: LICENSE
    to: LICENSE.txt

asar: true
compression: maximum
npmRebuild: false
removePackageScripts: true
publish: null

# A second launch must always execute the application entry point. If the
# launching shell exports ELECTRON_RUN_AS_NODE=1, an unfused executable runs the
# bundled main script as plain Node instead, exits before
# requestSingleInstanceLock(), and never reaches the existing hidden window.
# Disabling that fuse makes the packaged executable ignore the variable.
electronFuses:
  runAsNode: false

win:
  # Authored application icon (SVG source in build/icon.svg, regenerated with
  # scripts/generate-icons.mjs). Used for the executable and shortcuts.
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: DonDownload-${version}-${arch}-setup.${ext}
  requestedExecutionLevel: asInvoker

nsis:
  # Match the app icon in the installer, uninstaller and header surfaces.
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  # Assisted installer with an explicit install directory. It is not a
  # one-click silent install and it does not require elevation.
  oneClick: false
  perMachine: false
  allowElevation: false
  # Force current-user mode and skip the install-mode page, so an administrator
  # account cannot choose a per-machine installation.
  include: scripts/installer/force-current-user.nsh
  # Do not ship electron-builder's elevate helper; this installer never elevates.
  packElevateHelper: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DonDownload
  runAfterFinish: false
  # The uninstaller removes only the application installation and shortcuts.
  # It must not remove Downloads or the per-user application data directory.
  deleteAppDataOnUninstall: false
  uninstallDisplayName: DonDownload
